    - REDSTONE_TORCH
    - REDSTONE_WALL_TORCH
    - REDSTONE_LAMP
    - REDSTONE_BLOCK
    - REPEATER
    - COMPARATOR
    - OBSERVER
    - PISTON
    - STICKY_PISTON
    - MOVING_PISTON
    - PISTON_HEAD
    - LEVER
    - TARGET
    - TRIPWIRE
    - TRIPWIRE_HOOK
    - DAYLIGHT_DETECTOR
    - SCULK_SENSOR
    - CALIBRATED_SCULK_SENSOR
    - CRAFTER
    - DISPENSER
    - DROPPER
    - HOPPER
    - RAIL
    - POWERED_RAIL
    - DETECTOR_RAIL
    - ACTIVATOR_RAIL

far-blocks:
  enabled: true
  distance: 128
  interval-ticks: 10
  scan-budget: 6
  max-hidden: 20000

hoppers:
  enabled: true
  region-chunks: 8
